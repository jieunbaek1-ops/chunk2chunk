<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chunk2Speak · 국립공원 말하기 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF2EA; --paper: #FBFCF8; --ink: #1B2A26; --sub: #5A6A63; --line: #CBD6CB;
    --brown: #4A3527; --brown-ink: #FBF1D9; --gold: #F0B73F; --pine: #1F4D44; --on-pine: #FFFFFF;
    --moss: #DDE8DA; --ember: #C9472F; --ok: #2E7D5B; --warn: #B7791F; --shadow: rgba(27,42,38,.08);
    --display: 'Archivo', 'Noto Sans KR', system-ui, sans-serif;
    --body: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101A17; --paper: #17251F; --ink: #E6EEE7; --sub: #9DB0A6; --line: #2C3F37;
      --brown: #6B4B35; --brown-ink: #FBF1D9; --gold: #F0B73F; --pine: #6FB39E; --on-pine: #0E1714;
      --moss: #1F3A31; --ember: #E77A5F; --ok: #5FC29A; --warn: #E0A24A; --shadow: rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101A17; --paper: #17251F; --ink: #E6EEE7; --sub: #9DB0A6; --line: #2C3F37;
    --brown: #6B4B35; --brown-ink: #FBF1D9; --gold: #F0B73F; --pine: #6FB39E; --on-pine: #0E1714;
    --moss: #1F3A31; --ember: #E77A5F; --ok: #5FC29A; --warn: #E0A24A; --shadow: rgba(0,0,0,.3); color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body);
    font-size: 15.5px; line-height: 1.6; padding-bottom: env(safe-area-inset-bottom, 0px); }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .sign { background: var(--brown); color: var(--brown-ink); padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 16px;
    box-shadow: inset 0 0 0 3px var(--brown), inset 0 0 0 5px rgba(251,241,217,.18); }
  .sign-inner { max-width: 820px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; }
  .sign h1 { font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: 30px; letter-spacing: -.01em; margin: 0; line-height: 1.05; }
  .sign h1 span { color: var(--gold); }
  .sign p { margin: 0; font-size: 13.5px; opacity: .85; }
  .sign .spacer { flex: 1; }
  .sign .who { font-size: 13px; background: rgba(0,0,0,.2); padding: 4px 10px; border-radius: 3px; }

  .trail-wrap { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .trail { max-width: 820px; margin: 0 auto; display: flex; overflow-x: auto; padding: 14px 18px 12px; scrollbar-width: none; }
  .trail::-webkit-scrollbar { display: none; }
  .st { flex: 1 0 auto; min-width: 88px; background: none; border: 0; padding: 0 4px; text-align: left; cursor: pointer; position: relative; }
  .st::before { content: ""; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
  .st:first-child::before { display: none; }
  .st .dot { position: relative; z-index: 1; display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); }
  .st.done .dot { background: var(--pine); border-color: var(--pine); }
  .st.done::before { background: var(--pine); }
  .st.on .dot { background: var(--gold); border-color: var(--brown); box-shadow: 0 0 0 4px rgba(240,183,63,.35); }
  .st .lbl { display: block; font-size: 12.5px; margin-top: 6px; color: var(--sub); white-space: nowrap; }
  .st.on .lbl { color: var(--ink); font-weight: 700; }
  .st:disabled { cursor: default; opacity: .45; }
  .st.teacher { flex: 0 0 auto; margin-left: auto; min-width: 0; padding-left: 12px; }
  .st.teacher .lbl { margin-top: 0; }

  main { max-width: 820px; margin: 0 auto; padding: 18px 18px 40px; }
  h2 { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 23px; line-height: 1.2; margin: 0 0 6px; }
  h3 { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
  p { margin: 6px 0; }
  .lead { color: var(--sub); font-size: 14.5px; margin: 0 0 14px; }
  .tiny { color: var(--sub); font-size: 13px; }
  .ok-t { color: var(--ok); font-weight: 700; }
  .row { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }

  .panel { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 0 var(--shadow); }
  .panel.active { border-left-color: var(--gold); }
  .divider { border: 0; border-top: 1px dashed var(--line); margin: 14px 0; }

  .btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 4px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14.5px; }
  .btn:hover:not(:disabled) { background: var(--moss); }
  .btn.primary { background: var(--pine); color: var(--on-pine); border-color: var(--pine); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--pine); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.rec { border-color: var(--ember); color: var(--ember); display: inline-flex; align-items: center; gap: 8px; }
  .btn.rec.live { background: var(--ember); color: #fff; }
  .pulse { display: none; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .btn.rec.live .pulse { display: inline-block; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.5); opacity: .45 } }
  @media (prefers-reduced-motion: reduce) { .btn.rec.live .pulse { animation: none; } }

  input[type=text], input[type=number], select { width: 100%; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; padding: 9px 11px; font-size: 16px; }
  input[type=range] { width: 100%; accent-color: var(--pine); }
  textarea.notes { width: 100%; min-height: 72px; resize: vertical; border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 8px 2px; background-color: transparent;
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px); background-size: 100% 32px; line-height: 32px; font-size: 16px; }
  textarea.notes:focus { outline: none; border-bottom-color: var(--gold); }
  textarea.box { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px; word-break: break-all; }
  textarea.out { width: 100%; min-height: 150px; font-size: 15px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px; line-height: 1.7; }

  /* 시작 화면 대표 사진 3장 (고정) */
  .heroes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 16px; }
  .hero { margin: 0; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); background: var(--moss); aspect-ratio: 4 / 3; position: relative; }
  .hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hero figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 14px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .hero.empty { display: flex; align-items: flex-end; padding: 0; background: repeating-linear-gradient(135deg, var(--moss) 0 12px, var(--paper) 12px 24px); }
  .hero.empty figcaption { position: static; background: var(--paper); color: var(--ink); margin: 8px; padding: 4px 8px; width: fit-content; border-radius: 3px; font-size: 13px; }
  @media (max-width: 560px) { .heroes { grid-template-columns: 1fr; } .hero { aspect-ratio: 16 / 9; } }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tile { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; }
  .tile:hover:not(:disabled) { border-color: var(--brown); }
  .tile.on { border-color: var(--brown); background: var(--moss); }
  .tile .t { font-family: var(--display); font-stretch: 112%; font-weight: 700; font-size: 16px; display: block; }
  .tile .s { font-size: 13px; color: var(--sub); }

  .sign-tag { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 7px; background: var(--gold); color: #2A1B10; font-family: var(--display); font-weight: 800; font-size: 13px; border-radius: 3px; flex: none; }
  .unit { display: flex; gap: 12px; align-items: flex-start; }
  .chunk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .chunk { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; padding: 12px; cursor: pointer; }
  .chunk.on { border-color: var(--brown); background: var(--moss); }
  .chunk:disabled { opacity: .5; cursor: default; }
  .chunk b { display: block; font-size: 15px; }
  .chunk small { color: var(--sub); font-size: 12.5px; line-height: 1.45; display: block; margin-top: 2px; }
  .chunk .sign-tag { background: var(--line); color: var(--ink); }
  .chunk.on .sign-tag { background: var(--gold); color: #2A1B10; }

  .note { border-left: 3px dashed var(--brown); background: var(--moss); padding: 9px 12px; border-radius: 0 4px 4px 0; margin: 8px 0; font-size: 14.5px; }
  .note b { font-size: 12.5px; color: var(--sub); font-weight: 600; display: block; }
  .chip { display: inline-block; border: 1px solid var(--brown); padding: 3px 10px; border-radius: 3px; font-size: 13.5px; margin: 3px 4px 3px 0; }
  .full { font-size: 17px; line-height: 1.7; background: var(--moss); border-radius: 4px; padding: 14px 16px; margin: 10px 0; }
  .counter { font-size: 12.5px; color: var(--sub); }

  .meter { display: inline-flex; align-items: flex-end; gap: 3px; height: 28px; vertical-align: middle; }
  .meter i { display: block; width: 5px; height: 4px; background: var(--ember); border-radius: 1px; }
  .timer { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; margin: 8px 0; }

  .take { display: grid; grid-template-columns: 1fr; gap: 6px; background: var(--moss); border-radius: 4px; padding: 8px 10px; margin-top: 8px; }
  .take .meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); }
  audio { width: 100%; height: 40px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 9px 6px; text-align: left; vertical-align: middle; }
  th { color: var(--sub); font-weight: 600; font-size: 13px; }
  .stat { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1.1; display: block; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stats .panel { margin: 0; padding: 14px; }
  .bar { height: 12px; background: var(--moss); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--pine); }
  .bars { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px 10px; align-items: center; font-size: 13.5px; }
  .track { display: flex; gap: 3px; }
  .track i { flex: 1; height: 8px; border-radius: 2px; background: var(--line); }
  .track i.on { background: var(--pine); }
  .clickrow { cursor: pointer; }
  .clickrow:hover td { background: var(--moss); }
  .clickrow.sel td { background: var(--moss); }
  .detail-unit { border-top: 1px dashed var(--line); padding: 10px 0; }
  .detail-unit:first-child { border-top: 0; }
  .ai-out { background: var(--moss); border-radius: 4px; padding: 12px 14px; font-size: 15px; line-height: 1.75; white-space: pre-wrap; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { border: 1.5px solid var(--line); background: var(--paper); border-radius: 4px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .tab.on { background: var(--brown); color: var(--brown-ink); border-color: var(--brown); }

  .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--brown); color: var(--brown-ink);
    padding: 10px 16px; border-radius: 4px; font-size: 14px; box-shadow: 0 6px 18px var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 20; }
  .toast.show { opacity: 1; }
  main > * { animation: rise .32s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main > * { animation: none; } }
  @media (max-width: 560px) { .sign h1 { font-size: 25px; } .chunk-grid { grid-template-columns: 1fr; } .bars { grid-template-columns: 90px 1fr 34px; }
    th, td { font-size: 13px; padding: 7px 4px; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header class="sign">
  <div class="sign-inner">
    <div>
      <h1>Chunk2Speak<span>.</span></h1>
      <p>국립공원 말하기 여행 · 의미 단위로 쓰고, 말하고, 대화하기</p>
    </div>
    <div class="spacer"></div>
    <div class="who" id="who">학번을 입력하고 시작하세요</div>
  </div>
</header>
<div class="trail-wrap"><nav class="trail" id="nav" aria-label="활동 단계"></nav></div>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const nowISO = () => new Date().toISOString();
const safeName = s => String(s).replace(/[^A-Za-z0-9_-]/g, '_');
const sum = arr => arr.reduce((a, b) => a + b, 0);

function save() { if (S.sid) localStorage.setItem('c2s:' + S.sid, JSON.stringify(S)); }
function loadFor(sid) { const raw = localStorage.getItem('c2s:' + sid); if (raw) Object.assign(S, JSON.parse(raw)); }
function log(type, data = {}) {

function toast(msg) {

async function saveFile(filename, data) {
  const blob = data instanceof Blob ? data
    : new Blob(['\uFEFF' + data], { type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('저장했어요: ' + filename);
  return true;
}
function toCSV(rows) {
  const lines = ['time,sid,type,detail'];
  rows.forEach(r => { const { t, sid, type, ...rest } = r;
    lines.push([t, sid, type, `"${JSON.stringify(rest).replace(/"/g, '""')}"`].join(',')); });
  return lines.join('\n');
}
async function download(filename, text) {
  const ok = await saveFile(filename, text);
  if (!ok && !DL) showBox(text);
}
function showBox(text) {

}

/* ============================================================
   제출 코드 (계정 없이 교사에게 전달)
   ============================================================ */
const CODE_PREFIX = 'C2S1.';
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(s) {
  let b = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  const bin = atob(b);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function summary() {
  const chunkTakes = {}, chunkSecs = {};
  CATS.forEach(c => { const t = REC.chunk[c] || []; chunkTakes[c] = t.length; chunkSecs[c] = t.map(x => +x.secs.toFixed(1)); });
  const texts = {}, words = {};
  S.order.forEach(c => { texts[c] = S.texts[c] || ''; words[c] = wc(S.texts[c]); });
  return {
    sid: S.sid, park: S.park || '', parkName: S.park ? PARKS[S.park].short : '',
    step: S.step, order: S.order, texts, words, chunkTakes, chunkSecs,
    wholeSecs: S.wholeSecs, hintViews: S.hintViews,
    talk: { checks: S.talk.checks, turns: S.talk.turns, recorded: (REC.talk || []).length },
    pre: S.pre, post: S.post, updated: nowISO(),
    metrics: {
      chunk: Object.fromEntries(CATS.map(c => [c, (REC.chunk[c] || []).map(t => t.m || null)])),
      whole: REC.whole.map(t => t.m || null),
      talk: (REC.talk || []).map(t => t.m || null)
    }
  };
}
function makeCode() {
  return CODE_PREFIX + b64urlEncode(JSON.stringify(summary()));
}
function parseCodes(text) {
  const tokens = text.split(/\s+/).filter(t => t.startsWith(CODE_PREFIX));
  const out = [];
  let bad = 0;
  tokens.forEach(t => {
    try { const obj = JSON.parse(b64urlDecode(t.slice(CODE_PREFIX.length))); if (obj && obj.sid) out.push(obj); else bad++; }
    catch (e) { bad++; }
  });
  return { items: out, bad };
}
function loadSubs() { try { SUBS = JSON.parse(localStorage.getItem(TKEY) || '[]'); } catch (e) { SUBS = []; } }
function mergeSubs(items) {
  let added = 0, updated = 0;
  items.forEach(it => {
    const i = SUBS.findIndex(s => s.sid === it.sid);
    if (i < 0) { SUBS.push(it); added++; }
    else if (String(it.updated) > String(SUBS[i].updated)) { SUBS[i] = it; updated++; }
  });
  localStorage.setItem(TKEY, JSON.stringify(SUBS));
  return { added, updated };
}

  }).join('');

}
function go(n) {
  if (TEACH.mode) leaveTeacher();
  if (n >= 2 && !S.park) { toast('먼저 국립공원과 카드를 고르세요.'); n = 1; }
  if (n >= 3 && S.order.length < 3) { toast('카드를 3개 이상 고르세요.'); n = 1; }
  if (n >= 3 && S.order.some(c => wc(S.texts[c]) < 4)) { toast('모든 단위를 4단어 이상 써 주세요.'); n = 2; }
  stopRec();

}
function render() {
  buildNav();

  const views = [viewStart, viewCards, viewWrite, viewSpeakChunk, viewSpeakWhole, viewTalk, viewFinish];
  $('#app').innerHTML = views[S.step]();
  if (S.step === 0 && $('#pre')) $('#pre').value = S.pre;
  if (S.step === 2) updateWriteNext();
  if (S.step === 3) updateChunkNext();
  if (S.step === 4) updateWholeNext();
  if (recKey) startTimer();
}

/* ============================================================
   음성 분석 (학생 기기에서 계산: 속도·휴지·억양 곡선·크기)
   발음 정확도는 측정하지 않습니다.
   ============================================================ */
async function analyzeBlob(blob, expectedWords) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const raw = await ac.decodeAudioData(await blob.arrayBuffer());
    ac.close();
    const SR = 16000;
    const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(raw.duration * SR)), SR);
    const src = off.createBufferSource(); src.buffer = raw; src.connect(off.destination); src.start();
    const x = (await off.startRendering()).getChannelData(0);
    const hop = 160;                          // 10ms
    const frames = Math.floor(x.length / hop);
    if (frames < 10) return false;
    const db = new Float32Array(frames);
    for (let f = 0; f < frames; f++) {
      let s = 0; const o = f * hop;
      for (let i = 0; i < hop; i++) s += x[o + i] * x[o + i];
      db[f] = 10 * Math.log10(s / hop + 1e-12);
    }
    let peak = -Infinity; for (let f = 0; f < frames; f++) if (db[f] > peak) peak = db[f];
    const thr = Math.max(peak - 30, -60);
    const sp = new Uint8Array(frames);
    for (let f = 0; f < frames; f++) sp[f] = db[f] > thr ? 1 : 0;
    const first = sp.indexOf(1), last = sp.lastIndexOf(1);
    if (first < 0) return false;
    let speechFrames = 0, dbSum = 0;
    for (let f = first; f <= last; f++) if (sp[f]) { speechFrames++; dbSum += db[f]; }
    const speechSec = speechFrames * 0.01;
    const pauses = []; let run = 0;
    for (let f = first; f <= last; f++) {
      if (!sp[f]) run++;
      else { if (run >= 25) pauses.push(run * 0.01); run = 0; }
    }
    // 음높이: 16kHz 기준 75~400Hz 자기상관
    const WIN = 640, MINL = 40, MAXL = 214;
    const pitch = [];
    for (let f = first; f <= last; f += 2) {
      if (!sp[f]) continue;
      const o = f * hop;
      if (o + WIN + MAXL >= x.length) break;
      let e0 = 0; for (let i = 0; i < WIN; i++) e0 += x[o + i] * x[o + i];
      if (e0 < 1e-6) continue;
      let best = 0, bestLag = 0;
      for (let L = MINL; L <= MAXL; L++) {
        let c = 0, e1 = 0;
        for (let i = 0; i < WIN; i++) { const y = x[o + i + L]; c += x[o + i] * y; e1 += y * y; }
        const r = c / Math.sqrt(e0 * e1 + 1e-12);
        if (r > best) { best = r; bestLag = L; }
      }
      if (best > 0.6) pitch.push([f * 0.01, 12 * Math.log2((SR / bestLag) / 100)]);
    }
    let rangeSt = null, sdSt = null, medHz = null, contour = null;
    if (pitch.length >= 10) {
      const vals = pitch.map(p => p[1]);
      const sorted = [...vals].sort((a, b) => a - b);
      const med = sorted[Math.floor(sorted.length / 2)];
      const p10 = sorted[Math.floor(sorted.length * 0.1)], p90 = sorted[Math.floor(sorted.length * 0.9)];
      rangeSt = +(p90 - p10).toFixed(1);
      const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
      sdSt = +Math.sqrt(vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / vals.length).toFixed(1);
      medHz = Math.round(100 * Math.pow(2, med / 12));
      const t0 = first * 0.01, t1 = last * 0.01, BINS = 40;
      const bins = Array.from({ length: BINS }, () => []);
      pitch.forEach(([t, v]) => {
        const b = Math.min(BINS - 1, Math.max(0, Math.floor((t - t0) / Math.max(0.01, t1 - t0) * BINS)));
        bins[b].push(v - med);
      });
      contour = bins.map(b => b.length ? +(b.reduce((a, c) => a + c, 0) / b.length).toFixed(2) : null);
    }
    const wpm = expectedWords && speechSec > 0.5 ? Math.round(expectedWords / speechSec * 60) : null;
    return {
      dur: +(x.length / SR).toFixed(1),
      speech: +speechSec.toFixed(1),
      pauses: pauses.length,
      longPause: pauses.length ? +Math.max(...pauses).toFixed(2) : 0,
      db: +(dbSum / speechFrames).toFixed(1),
      wpm, rangeSt, sdSt, medHz, contour
    };
  } catch (e) { return false; }
}
function contourSVG(pts, label) {
  const W = 420, H = 130, P = 26;
  if (!pts || !pts.some(v => v !== null)) return '<p class="tiny">음높이를 충분히 잡지 못했어요. 더 또렷하게 녹음해 보세요.</p>';
  const vals = pts.filter(v => v !== null);
  const lo = Math.min(-2, ...vals), hi = Math.max(2, ...vals);
  const x = i => P + i * (W - 2 * P) / (pts.length - 1);
  const y = v => H - P - (v - lo) / ((hi - lo) || 1) * (H - 2 * P);
  let d = '', pen = false;
  pts.forEach((v, i) => {
    if (v === null) { pen = false; return; }
    d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
    pen = true;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" style="width:100%;height:auto;display:block">
    <line x1="${P}" y1="${y(0).toFixed(1)}" x2="${W - P}" y2="${y(0).toFixed(1)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <path d="${d}" fill="none" stroke="var(--pine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${P}" y="12" font-size="11" fill="var(--sub)">높은 음</text>
    <text x="${P}" y="${H - 6}" font-size="11" fill="var(--sub)">낮은 음</text>
    <text x="${W - P}" y="${H - 6}" font-size="11" fill="var(--sub)" text-anchor="end">시간 →</text></svg>`;
}

  else if (name === 'NotReadableError') msg = '다른 앱이 마이크를 쓰고 있어요. 그 앱을 끄고 다시 눌러 주세요.';
  else msg = '녹음을 시작하지 못했어요. 새 탭에서 열어 다시 시도해 주세요.';
  toast(msg);
}
function meterHTML() { return `<span class="meter" id="meter" aria-hidden="true">${'<i></i>'.repeat(14)}</span>`; }
async function toggleRec(key) {
  if (recKey === key) { stopRec(); return; }
  if (recKey) return;
  if (key.startsWith('chunk:') && (REC.chunk[key.slice(6)] || []).length >= MAX_CHUNK_TAKES) return;
  if (key === 'whole' && REC.whole.length >= MAX_WHOLE_TAKES) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('이 브라우저에서는 녹음을 지원하지 않아요. 최신 크롬이나 사파리에서 열어 주세요.'); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { micError(e); return; }
  chunksBuf = [];
  mr = new MediaRecorder(recStream);
  mr.ondataavailable = e => { if (e.data && e.data.size) chunksBuf.push(e.data); };
  mr.onstop = () => {
    const mime = mr.mimeType || 'audio/webm';
    const blob = new Blob(chunksBuf, { type: mime });
    const secs = (Date.now() - startT) / 1000;
    recStream.getTracks().forEach(t => t.stop());
    stopMeter();
    const k = recKey;
    recKey = null; clearInterval(timerId);
    onRecDone(k, blob, mime, secs);
  };
  startT = Date.now(); recKey = key; mr.start(); startMeter(); render();
}
function stopRec() { if (mr && mr.state !== 'inactive') mr.stop(); }
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => { const el = $('#timer'); if (el && recKey) el.textContent = ((Date.now() - startT) / 1000).toFixed(1) + '초'; }, 200);
}
function startMeter() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(recStream);
    const an = audioCtx.createAnalyser(); an.fftSize = 128; src.connect(an);
    const data = new Uint8Array(an.frequencyBinCount);
    const tick = () => {
      an.getByteTimeDomainData(data);
      let peak = 0; for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
      const level = Math.min(1, peak / 60);
      document.querySelectorAll('#meter i').forEach((b, i) => {
        b.style.height = (4 + Math.round(24 * level * (0.4 + 0.6 * Math.abs(Math.sin(i * 1.7 + Date.now() / 120))))) + 'px';
      });
      meterRaf = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { /* 음량 막대는 선택 기능 */ }
}
function stopMeter() {
  if (meterRaf) cancelAnimationFrame(meterRaf); meterRaf = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
}
function onRecDone(key, blob, mime, secs) {
  const item = { url: URL.createObjectURL(blob), secs, blob, mime, m: null };
  const expected = key.startsWith('chunk:') ? wc(S.texts[key.slice(6)])
    : key === 'whole' ? wc(S.order.map(c => S.texts[c]).join(' ')) : null;
  analyzeBlob(blob, expected).then(m => { item.m = m || false; save(); render(); });
  if (key.startsWith('chunk:')) {
    const c = key.slice(6);
    (REC.chunk[c] = REC.chunk[c] || []).push(item);
    log('record', { part: 'chunk', cat: c, take: REC.chunk[c].length, secs: +secs.toFixed(1) });
  } else if (key === 'whole') {
    REC.whole.push(item); S.wholeSecs.push(+secs.toFixed(1));
    log('record', { part: 'whole', take: REC.whole.length, secs: +secs.toFixed(1) });
  } else if (key === 'talk') {
    REC.talk.push(item);
    log('record', { part: 'talk', take: REC.talk.length, secs: +secs.toFixed(1) });
  }
  save(); render();
}

  const logs = allLogs();
  const sids = [...new Set(logs.map(r => r.sid))];
  const rows = sids.map(sid => {
    const mine = logs.filter(r => r.sid === sid);
    const cnt = t => mine.filter(r => r.type === t).length;
    return `<tr><td>${esc(sid)}</td><td>${cnt('write') ? '완료' : '-'}</td><td>${cnt('record')}</td><td>${cnt('hint')}</td>
      <td><button class="btn small" onclick="downloadStudent('${esc(sid)}')">CSV</button></td></tr>`;
  }).join('');
  return `<section class="panel active">
    <h2>이 기기 기록</h2>
    <p class="lead">이 기기에서 저장된 기록이에요. 학생 기기에서 받은 CSV가 있다면 함께 보관하세요.</p>
    <table><tr><th>학번</th><th>쓰기</th><th>녹음 수</th><th>쪽지</th><th>파일</th></tr>
      ${rows || '<tr><td colspan="5">기록이 없어요.</td></tr>'}</table>
    <div class="foot"><button class="btn" onclick="downloadAll()">전체 기록 CSV 저장</button><button class="btn" onclick="clearAll()">이 기기 기록 지우기</button></div>
    <textarea class="box" id="csvbox" style="display:none" aria-label="기록 텍스트"></textarea>
  </section>`;
}
function downloadStudent(sid) { download(`chunk2speak_${safeName(sid)}.csv`, toCSV(allLogs().filter(r => r.sid === sid))); }
function downloadAll() { download('chunk2speak_all.csv', toCSV(allLogs())); }
function clearAll() {
  if (!confirm('이 기기의 모든 기록을 지울까요? 되돌릴 수 없어요.')) return;
  Object.keys(localStorage).filter(k => k.startsWith('c2s:') && k !== TKEY).forEach(k => localStorage.removeItem(k));
  S = { step: 0, sid: '', park: null, order: [], texts: {}, hintLevel: 1, hintViews: { 1: 0, 2: 0, 3: 0 },
        hideText: false, pre: 3, post: null, wholeSecs: [], talk: { checks: {}, turns: 0, consent: false }, submittedAt: null };
  REC = { chunk: {}, whole: [], talk: [] };
  render();
}

/* ============================================================
   시작
   ============================================================ */
window.addEventListener('beforeunload', e => { if (recKey) { e.preventDefault(); e.returnValue = ''; } });
(async function init() {
  loadSubs();
  render();
})();
</script>
</body>
</html>
